name: Build Windows exe

on:
  push:
    branches: [main]
    paths: ['app/**', 'src/**', 'search/**', 'tests/**', 'config.py', 'musinsa_checker.spec', '.github/workflows/build-exe.yml']
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "pandas>=2.2,<4" "openpyxl>=3.1" pyinstaller

      - name: Build exe
        run: pyinstaller --noconfirm musinsa_checker.spec

      - name: Self test (exe로 가짜 데이터 점검 끝까지 실행)
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tests/make_fixture.py tests/fixture
          $p = Start-Process -FilePath dist/MusinsaChecker.exe -ArgumentList '--selftest', "$PWD/tests/fixture", "$PWD/selftest_out" -Wait -PassThru
          Get-Content -Encoding utf8 selftest_out/selftest.log
          Get-ChildItem selftest_out | Select-Object Name, Length
          if ($p.ExitCode -ne 0) { throw "selftest failed: $($p.ExitCode)" }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg | Out-Null
          Copy-Item dist/MusinsaChecker.exe pkg/
          Copy-Item docs/사용법.txt pkg/
          Compress-Archive -Path pkg/* -DestinationPath MusinsaChecker-windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: MusinsaChecker-windows
          path: MusinsaChecker-windows.zip
          retention-days: 30

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: MusinsaChecker-windows.zip
